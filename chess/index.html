<!DOCTYPE html>
<html>

<head>
	<title>Chess Game</title>
	<link rel="icon" href="chess.ico" type="image/x-icon" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-2EZ7F16X02"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());
		gtag('config', 'G-2EZ7F16X02');
	</script>
	<meta name="description" content="Chess" />
	<meta name="author" content="Dipta Roy">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/styles.css">
	<script src="js/engine.js"></script>
	<script src="js/app.js"></script>
</head>

<body id="body">
	<div class="main-container">
		<div class="info-panel">
			<!-- Reload Button (Top) -->
			<div class="reload-container">
				<a href="#" onclick="window.location.reload(); return false;" class="myButton">Reload</a>
			</div>

			<!-- Captured Pieces Panel -->
			<div class="captured-panel">
				<div class="panel-header">Captured</div>
				<div id="capturedPieces">
					<!-- Captured pieces will be injected here -->
				</div>
			</div>

			<!-- Move History Panel -->
			<div class="history-panel">
				<div class="panel-header">Move History</div>
				<div id="moveHistoryList">
					<!-- Moves go here -->
				</div>
			</div>
		</div>

		<div id="content">
			<div id="game"></div>
		</div>
	</div>

	<!-- Game Over Popup -->
	<div id="gameOverPopup"
		style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; color: white;">
		<div
			style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px; padding: 50px; text-align: center; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);">
			<h1 id="gameOverMessage"
				style="font-size: 3em; margin: 0 0 20px 0; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);">Checkmate!</h1>
			<p id="gameOverSubtext" style="font-size: 1.2em; opacity: 0.8; margin-bottom: 30px;">The king has been
				captured.</p>
			<a href="#" onclick="window.location.reload(); return false;" class="myButton"
				style="width: auto; padding: 15px 50px;">Play Again</a>
		</div>
	</div>
</body>

</html>
